name: CI Reutilizável - Serviço Python

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      ecr-repository:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.10'
      needs-postgres:
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install flake8
      - run: flake8 . --max-line-length=120 --exclude=tests

  test:
    name: Build e Testes Unitários
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toggle
          POSTGRES_PASSWORD: toggle
          POSTGRES_DB: toggledb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://toggle:toggle@localhost:5432/toggledb
      AUTH_SERVICE_URL: http://localhost:9999
      AWS_SQS_URL: https://sqs.us-east-1.amazonaws.com/000000000000/fake-queue
      AWS_DYNAMODB_TABLE: FakeTable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Carregar schema do banco de dados
        if: inputs.needs-postgres
        run: PGPASSWORD=toggle psql -h localhost -U toggle -d toggledb -f db/init.sql
      - run: pytest tests/ -v

  security-scan:
    name: Scan de Segurança (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install bandit
      - name: bandit (SAST)
        run: bandit -r . -x ./tests -ll
      - name: Scan de sistema de arquivos com Trivy (SCA)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  docker-build-push:
    name: Build, Scan e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t ${{ inputs.service-name }}:${{ github.sha }} .

      - name: Scan de imagem com Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ inputs.service-name }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Configurar credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag e push da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ inputs.service-name }}:${{ github.sha }} ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Resumo do Build Docker"
            echo "**Serviço**: ${{ inputs.service-name }}"
            echo "**Tag**: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
