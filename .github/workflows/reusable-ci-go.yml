name: CI Reutilizável - Serviço Go

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      ecr-repository:
        required: true
        type: string
      go-version:
        required: false
        type: string
        default: '1.21'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      GITOPS_TOKEN:
        required: false

env:
  AWS_REGION: us-east-1

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Build e Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -v

  security-scan:
    name: Scan de Segurança (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - name: Instalar gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec (SAST)
        run: gosec -severity high ./...
      - name: Scan de sistema de arquivos com Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  docker-build-push:
    name: Build, Scan e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    outputs:
      image: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t ${{ inputs.service-name }}:${{ github.sha }} .

      - name: Scan de imagem com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service-name }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Configurar credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag e push da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ inputs.service-name }}:${{ github.sha }} ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Resumo do Build Docker"
            echo "**Serviço**: ${{ inputs.service-name }}"
            echo "**Tag**: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  gitops:
    name: Atualiza tag no GitOps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build-push]
    uses: FIAP-Teach-Challenge-2/toggle-master-infra/.github/workflows/gitops-bump.yml@main
    with:
      service: ${{ inputs.service-name }}
      image: ${{ needs.docker-build-push.outputs.image }}
      tag: ${{ github.sha }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
